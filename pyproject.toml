[project]
name = "research-tools"
version = "0.1.0"
description = "Minimal, hackable tools for LLM interpretability research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML/DL libraries
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",

    # Interpretability tools
    "nnterp>=0.1.0",
    "peft>=0.7.0",

    # API clients
    "anthropic>=0.40.0",
    "requests>=2.31.0",

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",

    # ML utilities
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",

    # Configuration
    "pyyaml>=6.0",
    "pydantic>=2.0.0",

    # Type hints
    "typing-extensions>=4.5.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Interactive/notebook support
    "ipykernel>=6.25.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "ruff>=0.0.270",
    "mypy>=1.3.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["probes", "elicitation", "elicitation.prompts"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false