# cPCA configuration for conversation data (regional activations - assistant turns)
# Contrasts emotional conversations against neutral paraphrases

name: cpca_conversations_regional_asst
output_dir: /workspace-vast/annas/git/research-tools/probes/results/cpca_conversations_regional_asst
seed: 42
device: cuda

# Data path (combined emotional + neutral, assistant region)
data_path: /workspace-vast/annas/git/research-tools/data/activations/regional/conversations2_regional_asst.h5
model_name: google/gemma-3-27b-it

# cPCA parameters
alpha: null  # null = auto-tune per layer
alpha_range: [100, 10000]  # High alpha range based on texts results
n_alphas: 10
n_components: 50
use_diffs: true  # Use diffs (emotional - neutral) as target
