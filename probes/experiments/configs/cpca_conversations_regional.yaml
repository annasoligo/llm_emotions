# cPCA configuration for conversation data (regional activations)
# Contrasts emotional conversations against neutral paraphrases
# Regional activations: user, assistant, special tokens

name: cpca_conversations_regional
output_dir: /workspace-vast/annas/git/research-tools/probes/results/cpca_conversations_regional
seed: 42
device: cuda

# Data path (will be the combined file)
data_path: /workspace-vast/annas/git/research-tools/data/activations/conversations2_combined.h5
model_name: google/gemma-3-27b-it

# cPCA parameters
alpha: null  # null = auto-tune per layer
alpha_range: [100, 10000]  # High alpha range based on texts results
n_alphas: 10
n_components: 50
use_diffs: true  # Use diffs (emotional - neutral) as target

# Regional activations - will run for each region type
activation_type: regional
